# Builds the Android APK (or Play Store AAB) in the cloud with GameCI and publishes it as a GitHub Release.
#
# One-time setup (repo Settings → Secrets and variables → Actions → New repository secret):
#   UNITY_LICENSE                   contents of your Unity license file (Personal: C:\ProgramData\Unity\Unity_lic.ulf)
#   UNITY_EMAIL, UNITY_PASSWORD     your Unity account (GameCI re-activates the license with them)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS
#                                   the game's signing keystore (optional for APKs, required for Play Store AABs)
#
# Release: tagged v<version>-build<build> (from Player Settings, see NATO Squad → Version). Building the same version
# again replaces the file in that release, so raise the version / build number for a new release.
#
# Skips unneeded builds: the "check" job compares this commit with the commit the latest release was built from
# (its tag). If nothing that goes into the app changed (Assets/, Packages/, ProjectSettings/), it stops in a few
# seconds without building. Tick "Build even if nothing changed" when running the workflow to build anyway.

name: Build Android APK

# manual only: Actions tab → "Build Android APK" → Run workflow
on:
  workflow_dispatch:
    inputs:
      format:
        description: APK to install on a device, or AAB to upload to Google Play
        type: choice
        options: [apk, aab]
        default: apk
      force:
        description: Build even if nothing changed since the latest release
        type: boolean
        default: false

permissions:
  contents: write   # to create the release

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  # Is a new build needed? (a few seconds)
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout repository (with history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with the latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Build forced."; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LAST=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -z "$LAST" ] || ! git rev-parse -q --verify "refs/tags/$LAST" > /dev/null; then
            echo "No earlier release found: building."; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BUILT=$(git rev-list -n 1 "refs/tags/$LAST")
          echo "Latest release: $LAST, built from ${BUILT::7}; this run: ${GITHUB_SHA::7}"
          CHANGED=$(git diff --name-only "$BUILT" "$GITHUB_SHA" -- Assets Packages ProjectSettings)
          if [ -z "$CHANGED" ]; then
            echo "::notice title=No new build needed::Nothing in Assets/, Packages/ or ProjectSettings/ changed since $LAST. Run again with 'Build even if nothing changed' to build anyway."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed since $LAST:"; echo "$CHANGED" | head -50
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  buildForAndroid:
    name: Build Android (${{ inputs.format }})
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      # The Unity Android image is huge (about 15 GB unpacked) and the runner's one disk is shared by everything,
      # swap included: remove what this job doesn't use (the slow "large packages" removal stays off).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # The runner has under 8 GB of memory and IL2CPP needs more: without swap the machine runs out and GitHub
      # stops it mid-build ("The runner has received a shutdown signal").
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 6G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h / /mnt

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -m1 '^  bundleVersion:' ProjectSettings/ProjectSettings.asset | awk '{print $2}')
          CODE=$(grep -m1 'AndroidBundleVersionCode:' ProjectSettings/ProjectSettings.asset | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-build$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, build $CODE"

      - name: Check signing for Play Store bundles
        if: inputs.format == 'aab'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Google Play needs a signed AAB. Add the ANDROID_KEYSTORE_* secrets (see README, 'Signing')."
            exit 1
          fi

      # Library (imported assets, compiled scripts, IL2CPP cache) makes later builds much faster. It's restored here
      # and saved at the end even when the build fails, so the next run doesn't start from scratch.
      - name: Restore Unity Library
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-Android-${{ github.run_id }}
          restore-keys: |
            Library-Android-

      - name: Build with Unity
        id: build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: ${{ inputs.format == 'aab' && 'androidAppBundle' || 'androidPackage' }}
          buildName: NATO-Squad
          # keep the game's own version numbers (Player Settings) instead of GameCI's git-based ones
          versioning: Custom
          version: ${{ steps.version.outputs.version }}
          androidVersionCode: ${{ steps.version.outputs.code }}
          # Sign with the game's own keystore when its secrets are set, so cloud and local builds can update each
          # other on a device. Without them, GameCI signs with a throwaway debug key (uninstall first to install).
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'nato-squad.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Save Unity Library
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-Android-${{ github.run_id }}

      - name: Find the build
        id: out
        env:
          EXT: ${{ inputs.format }}
        run: |
          FILE=$(find build -name "*.$EXT" | head -n1)
          [ -n "$FILE" ] || { echo "::error::No .$EXT was produced"; exit 1; }
          NAME="NATO-Squad-${{ steps.version.outputs.tag }}.$EXT"
          cp "$FILE" "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NATO-Squad-Android-${{ steps.version.outputs.tag }}-${{ inputs.format }}
          path: ${{ steps.out.outputs.file }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FILE: ${{ steps.out.outputs.file }}
        run: |
          NOTES="NATO Squad v${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.code }}).
          Built from ${GITHUB_SHA::7} by run #${{ github.run_number }}.

          Android APK: download it on the device and open it (allow installs from this source when asked).
          Android AAB: upload it in Google Play Console (Test and release → a track → Create new release).
          iOS IPA: see the 'Build iOS IPA' workflow."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
            gh release edit "$TAG" --notes "$NOTES"
            # move the tag to this commit, so the next run compares against what this build was made from
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh release create "$TAG" "$FILE" --title "NATO Squad v${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.code }})" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
